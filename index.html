<!doctype html>
<html lang="ru">
<meta name="theme-color" content="#16181B">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Roksi">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Roksi</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: one phone column (max 480px). Tabs: Записи · График · Управление · Настройки (мастер: Заработок вместо Управления); ☰ drawer for companies and role check. Black-and-white with calm payment colours. */
:root {
  --bg: #F3F4F1; --surface: #FFFFFF; --ink: #16181B; --muted: #5B6168; --soft: #3E434A;
  --line: #E2E4E0; --line2: #ECEDEA; --field: #C9CCC7; --sel: #DCDDDA;
  --inv: #16181B; --inv-fg: #FFFFFF; --inv-muted: #C9CDC6; --inv-line: #3A3E44; --inv-field: #24272B;
  --cash-bg: #DDF0E6; --cash-bd: #A9D5BF; --cash-fg: #123D2C;
  --tr-bg: #FCE9D7; --tr-bd: #EDC29D; --tr-fg: #5A2C0B;
  --card-bg: #E4E6EA; --card-bd: #C2C6CC; --card-fg: #23272D;
  --vac-bg: #E6EEFB; --vac-fg: #1F4FA3;
  --pre-bg: #EDE7F8; --pre-bd: #C9B8EA; --pre-fg: #3B2470;
  --online: #D93A2B; --warn-bg: #FBEADF; --warn-fg: #8A3407; --warn-inv: #F4C9A6;
  --good: #0B6E4F; --good-bg: #E3F1EA; --good-fg: #0B4E39;
  --shadow: 0 6px 18px rgba(22,24,27,.22); --scrim: rgba(15,17,19,.45);
  --f-body: 'Onest', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --f-disp: 'Unbounded', 'Onest', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0F1113; --surface: #1A1D21; --ink: #F1F2EF; --muted: #9AA0A6; --soft: #C3C7CB;
  --line: #2A2E33; --line2: #23272B; --field: #3A3F45; --sel: #2E3238;
  --inv: #F1F2EF; --inv-fg: #16181B; --inv-muted: #4A4F55; --inv-line: #C9CCC7; --inv-field: #FFFFFF;
  --cash-bg: #183A2C; --cash-bd: #2C5A46; --cash-fg: #CFEBDC;
  --tr-bg: #43301F; --tr-bd: #6B4A2E; --tr-fg: #F6DCC4;
  --card-bg: #2C3036; --card-bd: #454A52; --card-fg: #E2E4E8;
  --vac-bg: #1C2A44; --vac-fg: #B9CDF2;
  --pre-bg: #2D2440; --pre-bd: #4E3F70; --pre-fg: #DCD0F5;
  --online: #FF5A48; --warn-bg: #3A2416; --warn-fg: #F4C9A6; --warn-inv: #8A3407;
  --good: #4CC495; --good-bg: #16332A; --good-fg: #BFE9D6;
  --shadow: 0 6px 18px rgba(0,0,0,.5); --scrim: rgba(0,0,0,.6); color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0F1113; --surface: #1A1D21; --ink: #F1F2EF; --muted: #9AA0A6; --soft: #C3C7CB;
  --line: #2A2E33; --line2: #23272B; --field: #3A3F45; --sel: #2E3238;
  --inv: #F1F2EF; --inv-fg: #16181B; --inv-muted: #4A4F55; --inv-line: #C9CCC7; --inv-field: #FFFFFF;
  --cash-bg: #183A2C; --cash-bd: #2C5A46; --cash-fg: #CFEBDC;
  --tr-bg: #43301F; --tr-bd: #6B4A2E; --tr-fg: #F6DCC4;
  --card-bg: #2C3036; --card-bd: #454A52; --card-fg: #E2E4E8;
  --vac-bg: #1C2A44; --vac-fg: #B9CDF2;
  --pre-bg: #2D2440; --pre-bd: #4E3F70; --pre-fg: #DCD0F5;
  --online: #FF5A48; --warn-bg: #3A2416; --warn-fg: #F4C9A6; --warn-inv: #8A3407;
  --good: #4CC495; --good-bg: #16332A; --good-fg: #BFE9D6;
  --shadow: 0 6px 18px rgba(0,0,0,.5); --scrim: rgba(0,0,0,.6); color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.4; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
h1, h2 { margin: 0; text-wrap: balance; }
h1 { font-family: var(--f-disp); font-size: 20px; font-weight: 700; letter-spacing: -.01em; }
h2 { font-size: 15px; font-weight: 700; }
p { margin: 0; }
.app { max-width: 480px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 12px 150px; display: flex; flex-direction: column; gap: 12px; }
.app.no-nav { padding-block-end: 40px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.sm { font-size: 13px; }
.hint { font-size: 12.5px; color: var(--muted); line-height: 1.45; }
.hint.warn { color: var(--warn-fg); }
.hint.good { color: var(--good); }
.lbl { font-size: 13px; font-weight: 700; }
.lbl-strong { font-size: 15px; font-weight: 700; color: var(--ink); }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.plain { padding: 0; }

/* header */
.top { display: flex; align-items: center; gap: 12px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 6px; }
.top-t { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
.top-t span { font-size: 13px; color: var(--muted); }
.icon-btn { width: 44px; height: 44px; border-radius: 12px; border: 0; background: var(--surface); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

/* cards & controls */
.card { background: var(--surface); border-radius: 18px; border: 0; }
.sec { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.card.inv { background: var(--inv); color: var(--inv-fg); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chip { min-height: 44px; padding: 0 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-size: 15px; font-weight: 600; white-space: nowrap; }
.chip.on { background: var(--inv); color: var(--inv-fg); border-color: var(--inv); }
.chip.out { border-color: var(--ink); min-height: 40px; font-size: 14px; }
.chip.dim { opacity: .45; }
.chip.svc { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; gap: 1px; padding: 8px 12px; text-align: left; white-space: normal; }
.chip.svc small { font-size: 12px; opacity: .8; font-weight: 500; }
.svc-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
.time-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.time-grid .chip { padding: 0; }
.tgroup { display: flex; flex-direction: column; gap: 6px; }
.tgroup h3 { margin: 0; font-size: 13px; color: var(--muted); font-weight: 600; }
.datechip { min-width: 58px; min-height: 58px; padding: 4px 6px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0; position: relative; }
.datechip span { font-size: 11px; font-weight: 600; }
.datechip b { font-size: 17px; }
.datechip i { width: 5px; height: 5px; border-radius: 50%; background: var(--good); position: absolute; bottom: 5px; }
.btn { min-height: 48px; padding: 0 16px; border-radius: 14px; border: 1.5px solid var(--ink); background: transparent; font-size: 15px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.dashed { border-style: dashed; width: 100%; }
.btn.danger { border-color: var(--online); color: var(--online); }
.btn.ghost { border-color: transparent; }
.btn.inv { background: var(--inv); color: var(--inv-fg); border-color: var(--inv); }
.btn-sm { min-height: 36px; padding: 0 12px; border-radius: 10px; border: 1.5px solid var(--ink); background: var(--surface); font-size: 13px; font-weight: 700; }
.btn-sm.inv { background: var(--inv); color: var(--inv-fg); }
.cta { width: 100%; min-height: 60px; border-radius: 18px; border: 0; background: var(--inv); color: var(--inv-fg); font-size: 17px; font-weight: 700; padding: 0 16px; }
.cta.green { background: var(--good); color: #FFFFFF; }
.sticky-cta { position: sticky; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 4; box-shadow: var(--shadow); }
.row2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.row3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.fld { display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: var(--muted); }
.inp, .fld input, .fld textarea { width: 100%; min-height: 48px; border: 1.5px solid var(--field); border-radius: 12px; padding: 0 12px; font-size: 16px; background: var(--surface); color: var(--ink); }
.fld textarea { min-height: 72px; padding: 10px 12px; resize: vertical; }
.phone-row { display: flex; gap: 8px; }
.prefix { min-height: 52px; padding: 0 12px; border-radius: 14px; border: 0; background: var(--bg); display: flex; align-items: center; font-size: 17px; font-weight: 700; flex-shrink: 0; }
.card .prefix { background: var(--line2); }
.phone-row input { width: 100%; min-height: 52px; border: 1.5px solid var(--ink); border-radius: 14px; padding: 0 12px; font-size: 18px; font-weight: 600; flex: 1; min-width: 0; background: var(--surface); color: var(--ink); }
.person { width: 100%; min-height: 56px; padding: 8px 12px; border-radius: 14px; border: 2px solid var(--line); background: var(--surface); display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: left; }
.person.on { border-color: var(--ink); background: var(--bg); }
.person span { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.person small { font-size: 12px; color: var(--muted); }
.radio { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--ink); flex-shrink: 0; display: flex; align-items: center; justify-content: center; }
.person.on .radio::after { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--ink); }
.sugg { width: 100%; display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); text-align: left; }
.sugg small { color: var(--muted); font-size: 13px; }
.sugg mark { background: var(--good-bg); color: var(--good-fg); border-radius: 3px; }
.two { border: 1.5px solid var(--ink); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; background: var(--surface); }
.toggle-row { width: 100%; min-height: 52px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--surface); display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 12px; text-align: left; font-size: 14px; font-weight: 600; }
.toggle-row span { display: flex; flex-direction: column; }
.toggle-row small { font-size: 12px; font-weight: 400; color: var(--muted); }
.sw { width: 52px; height: 30px; border-radius: 15px; background: var(--field); position: relative; flex-shrink: 0; transition: background .15s; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF; transition: transform .15s; }
.sw.on { background: var(--ink); }
.sw.on::after { transform: translateX(22px); background: var(--surface); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); background: var(--line); border-radius: 12px; padding: 4px; gap: 2px; }
.seg button { min-height: 38px; border: 0; border-radius: 9px; background: transparent; font-size: 14px; font-weight: 600; color: var(--soft); }
.seg button.on { background: var(--surface); color: var(--ink); font-weight: 700; }

/* journal */
.jbar { display: flex; align-items: center; gap: 10px; }
.jt { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
.jt h1 { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.paid-pill { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; padding: 8px 12px; border-radius: 14px; border: 0; background: var(--inv); color: var(--inv-fg); flex-shrink: 0; }
.paid-pill span { font-size: 11px; color: var(--inv-muted); }
.paid-pill b { font-size: 16px; font-variant-numeric: tabular-nums; }
.week { display: flex; align-items: center; gap: 4px; }
.wk-arrow { width: 28px; height: 58px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; color: var(--muted); flex-shrink: 0; }
.days { flex: 1; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.day { height: 58px; border-radius: 12px; border: 0; background: var(--surface); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0; color: var(--ink); }
.day span { font-size: 11px; font-weight: 600; }
.day b { font-size: 17px; }
.day small { font-size: 10px; opacity: .8; }
.day.today { background: var(--inv); color: var(--inv-fg); }
.day.on:not(.today) { background: var(--sel); color: var(--ink); opacity: .85; box-shadow: inset 0 0 0 1.5px var(--field); }
.day.today.on { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--inv); }
.today-btn { min-height: 36px; padding: 0 12px; border-radius: 10px; border: 1.5px solid var(--ink); background: transparent; font-size: 13px; font-weight: 700; }
.move-banner { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 6; background: var(--inv); color: var(--inv-fg); border-radius: 14px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
.move-banner div { display: flex; flex-direction: column; gap: 2px; font-size: 13px; }
.move-banner span { color: var(--inv-muted); }
.move-banner .btn-sm { background: var(--inv-fg); color: var(--inv); border-color: var(--inv-fg); }
.checklist { background: var(--good-bg); color: var(--good-fg); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.checklist button.item-l { border: 0; background: var(--surface); color: var(--ink); border-radius: 12px; min-height: 44px; padding: 0 12px; display: flex; justify-content: space-between; align-items: center; font-weight: 600; font-size: 14px; }
.checklist button.item-l.done { opacity: .55; text-decoration: line-through; }
.grid-card { background: var(--surface); border-radius: 18px; padding: 8px 4px 10px 0; margin-inline: -8px; }
.grid-scroll { overflow-x: auto; }
.grid { display: grid; }
.g-corner, .g-times { position: sticky; left: 0; z-index: 3; background: var(--surface); }
.g-head { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 0 0 6px; border: 0; border-bottom: 1px solid var(--line); background: transparent; min-width: 0; }
.g-corner { border-bottom: 1px solid var(--line); }
.av { width: 30px; height: 30px; border-radius: 50%; background: var(--inv); color: var(--inv-fg); display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; }
.av.big { width: 44px; height: 44px; font-size: 17px; }
.g-head .nm { font-size: 12px; font-weight: 700; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-inline: 2px; }
.g-head.off .av { background: var(--line); color: var(--muted); }
.g-head.off .nm { writing-mode: vertical-rl; font-size: 11px; color: var(--muted); }
.g-times span { position: absolute; left: 0; width: 36px; text-align: right; font-size: 11px; color: var(--muted); transform: translateY(-50%); font-variant-numeric: tabular-nums; }
.g-times span:first-child { transform: none; }
.col { position: relative; border-left: 1px solid var(--line2); margin: 0 1px; background-image: repeating-linear-gradient(to bottom, var(--line2) 0, var(--line2) 1px, transparent 1px, transparent 72px); }
.col.off { background: repeating-linear-gradient(135deg, var(--line2) 0 5px, var(--surface) 5px 10px); }
.col.off::after { content: "выходной"; position: absolute; top: 12px; left: 50%; transform: translateX(-50%); writing-mode: vertical-rl; font-size: 11px; color: var(--muted); }
.col.off.vac::after { content: "отпуск"; }
.col.target { background-color: color-mix(in srgb, var(--good) 8%, transparent); outline: 1.5px dashed var(--good); outline-offset: -2px; cursor: copy; }
.offzone { position: absolute; left: 0; right: 0; background: repeating-linear-gradient(135deg, var(--line2) 0 5px, transparent 5px 10px); pointer-events: none; }
.appt { position: absolute; left: 2px; right: 2px; border-radius: 8px; border: 1px solid var(--field); background: var(--surface); padding: 3px 5px; display: flex; flex-direction: column; overflow: hidden; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; cursor: pointer; z-index: 1; }
.appt b { font-size: 11px; font-variant-numeric: tabular-nums; }
.appt span { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.appt small { font-size: 10px; opacity: .8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.appt.online { padding-right: 9px; }
.appt.online::after { content: ""; position: absolute; top: 0; right: 0; bottom: 0; width: 4px; background: var(--online); }
.appt .hold { position: absolute; left: 0; bottom: 0; height: 4px; width: 0; background: currentColor; opacity: .75; }
.appt.holding { transform: scale(1.03); box-shadow: var(--shadow); z-index: 4; }
.appt.holding .hold { animation: hold 2s linear forwards; }
@keyframes hold { to { width: 100%; } }
.appt.moving { outline: 2px solid var(--ink); box-shadow: var(--shadow); z-index: 4; }
.k-wait { background: var(--surface); color: var(--ink); border-color: var(--field); }
.k-chair { background: var(--inv); color: var(--inv-fg); border-color: var(--inv); }
.k-cash { background: var(--cash-bg); color: var(--cash-fg); border-color: var(--cash-bd); }
.k-transfer { background: var(--tr-bg); color: var(--tr-fg); border-color: var(--tr-bd); }
.k-card { background: var(--card-bg); color: var(--card-fg); border-color: var(--card-bd); }
.k-pre { background: var(--pre-bg); color: var(--pre-fg); border-color: var(--pre-bd); }
.bell { position: relative; }
.badge { position: absolute; top: 4px; right: 4px; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--online); color: #FFFFFF; font-size: 11px; font-weight: 700; font-style: normal; display: flex; align-items: center; justify-content: center; }
.stars { color: var(--ink); letter-spacing: 1px; font-size: 15px; white-space: nowrap; }
.stars.big { font-size: 34px; letter-spacing: 4px; }
.star-btn { border: 0; background: transparent; font-size: 40px; padding: 0 2px; color: var(--field); line-height: 1; }
.star-btn.on { color: var(--ink); }
.tag { display: inline-block; padding: 2px 8px; border-radius: 999px; background: var(--bg); font-size: 11.5px; font-weight: 700; margin-right: 4px; white-space: nowrap; }
.tag.red { background: var(--warn-bg); color: var(--warn-fg); }
.status-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.status-row button { min-height: 44px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--surface); font-size: 13.5px; font-weight: 700; }
.status-row button.on { background: var(--inv); color: var(--inv-fg); border-color: var(--inv); }
.bar { height: 8px; border-radius: 4px; background: var(--line2); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ink); border-radius: 4px; }
.delta { font-size: 12px; font-weight: 700; }
.delta.up { color: var(--good); }
.delta.down { color: var(--online); }
.qr-box { display: flex; justify-content: center; padding: 12px; background: #FFFFFF; border-radius: 14px; }
.qr-box img, .qr-box canvas { width: 200px; height: 200px; }
.mod-off { opacity: .5; }
.seg.scroll { grid-auto-columns: max-content; overflow-x: auto; scrollbar-width: none; }
.seg.scroll button { padding: 0 12px; }
.k-block { background: repeating-linear-gradient(135deg, var(--line2) 0 6px, var(--surface) 6px 12px); color: var(--ink); border-color: var(--field); }
.k-noshow { background: var(--surface); color: var(--muted); border-style: dashed; text-decoration: line-through; }
.nowl { position: absolute; left: -1px; right: -1px; height: 2px; background: var(--online); pointer-events: none; z-index: 2; }
.nowt { position: absolute; left: 0; font-size: 10px; font-weight: 700; color: #FFFFFF; background: var(--online); padding: 1px 3px; border-radius: 4px; transform: translateY(-50%); z-index: 3; }

/* наличные за день без остатка: нужны для «на начало дня» */
function cashFlowOf(date) {
  var n = 0;
  db.appts.forEach(function (a) { if (a.date === date && a.status === 'paid' && a.pay) a.pay.parts.forEach(function (p) { if (p.method === 'cash') n += p.amount; }); });
  db.sales.forEach(function (x) { if (x.date === date) x.parts.forEach(function (p) { if (p.method === 'cash') n += p.amount; }); });
  expensesOn(date).forEach(function (e) { if (e.cash) n -= e.amount; });
  db.cashops.forEach(function (o) { if (o.date === date) n += o.type === 'in' ? o.amount : -o.amount; });
  db.payouts.forEach(function (p) { if (p.date === date && p.cash && (p.type === 'pay' || p.type === 'advance')) n -= p.amount; });
  return n;
}
/* остаток на начало дня = наличные при последнем закрытии + движения дней после него (ищем до 31 дня назад) */
function cashOpening(date) {
  for (var i = 1, flow = 0; i <= 31; i++) {
    var d = addDays(date, -i);
    if (db.closed[d]) return { amount: db.closed[d].cash + flow, from: d };
    flow += cashFlowOf(d);
  }
  return { amount: 0, from: null };
}

  });
  return out;
}

function periodStats(from, to) {
  var vis = db.appts.filter(function (a) { return a.kind === 'visit' && a.date >= from && a.date <= to && a.status !== 'cancelled'; });
  var paid = vis.filter(function (a) { return a.status === 'paid'; });

  Object.keys(cids).forEach(function (cid) { var first = clientVisits(cid)[0]; if (first && first.date >= from) newC++; else retC++; });
  var noshow = vis.filter(function (a) { return a.status === 'noshow'; }).length;
  var bySrc = {};

  return { vis: vis, paid: paid, rev: rev, svcRev: svcRev, avg: paid.length ? svcRev / paid.length : 0, clients: Object.keys(cids).length, newC: newC, retC: retC, noshow: noshow, noshowPct: (function () { var done = vis.filter(function (a) { return a.status === 'paid' || a.status === 'arrived' || a.status === 'noshow'; }).length; return done ? noshow / done * 100 : 0; })(), bySrc: bySrc, guests: paid.filter(function (a) { return !a.clientId; }).length };
}

    var blk = sum(apptsOn(d).filter(function (a) { return a.masterId === mid && a.kind === 'block'; }), function (a) { return a.dur; });
    work += Math.max(0, w.end - w.start - (w.brk ? w.brk[1] - w.brk[0] : 0) - blk);
    busy += sum(apptsOn(d).filter(function (a) { return a.masterId === mid && a.kind === 'visit' && (a.status === 'paid' || a.status === 'arrived' || (a.status === 'booked' && d >= todayKey())); }), function (a) { return a.dur; });
  }
  return work ? Math.min(100, busy / work * 100) : 0;
}

    if (db.appts.some(function (b) { return b.clientId === a.clientId && b.masterId === mid && b.status === 'paid' && b.date > a.date && dayDiff(a.date, b.date) <= days; })) back++;

function sellSum(f) {

  return int(f.amount);
}
function sellSave() {

        catch (err) { toast('Это не файл копии Roksi'); }
      }
    };
    r.readAsText(file);
  }
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && (ui.sheet || ui.move || ui.drawer)) { ui.sheet = null; ui.move = null; ui.drawer = false; render(); } });
setInterval(function () { if (db && ui.view === 'journal' && !ui.sheet && !ui.drawer && !hold.el && document.visibilityState === 'visible') render(); }, 60000);

var loaded = load();
if (loaded) store = loaded;
store.list = (store.list || []).filter(function (c) { return c && c.masters && c.masters.length; }).map(migrate);
db = store.list.find(function (c) { return c.id === store.current; }) || null;
if (!db) ui.view = 'welcome';
render();
})();
